# Go bindings codegen (committed under criteria/v2 at repo root). The
# TS + Python packages are generated at publish time via buf.gen.multi.yaml —
# this template only refreshes the committed Go bindings:
#
#   buf generate --template buf.gen.go.yaml
#
# Plugin versions are pinned (repo doctrine: no floating @latest) so local
# runs and CI resolve the same codegen.
version: v2
plugins:
  - local: ["go", "run", "google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11"]
    out: .
    opt: paths=source_relative
  - local: ["go", "run", "google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2"]
    out: .
    opt: paths=source_relative